services:
  - type: web
    name: housing-wave-api
    runtime: python
    buildCommand: pip install -r apps/api/requirements.txt
    startCommand: uvicorn apps.api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_MODE
        value: postgres
      - key: DATABASE_URL
        sync: false
      - key: APP_ENV
        value: production
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: LH_HOUSING_NOTICE_API_KEY
        sync: false
      - key: SEOUL_OPEN_DATA_API_KEY
        sync: false
